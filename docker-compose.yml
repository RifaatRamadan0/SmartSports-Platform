services:
  postgres:
    # Official PostgreSQL image version 16
    image: postgres:16
    
    # Name of the container
    container_name: smartsports-db
    
    # Always restart the container if it stops unexpectedly
    restart: unless-stopped
    
    # Database credentials — loaded from .env (gitignored). Copy .env.example → .env.
    # These must match your appsettings.Development.json connection string.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Bind to localhost only — prevents external network access to the database.
    ports:
      - "127.0.0.1:5432:5432"
    
    # Persist data so it survives docker compose down
    volumes:
      - smartsports-db-data:/var/lib/postgresql/data

  pgadmin:
    # pgAdmin - browser-based UI to view and manage your database
    image: dpage/pgadmin4
    
    container_name: smartsports-pgadmin
    
    restart: unless-stopped
    
    environment:
      # Login credentials for pgAdmin UI — loaded from .env (gitignored).
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    
    # pgAdmin will be accessible at http://localhost:5050
    ports:
      - "127.0.0.1:5050:80"
    
    # pgAdmin depends on postgres being up first
    depends_on:
      - postgres

# Named volume to persist database data
volumes:
  smartsports-db-data: